on:
  pull_request: {}
  push:
    branches:
      - main

steps:
  - label: ":pytest: Integration tests ({{matrix}})"
    matrix:
      - "staging/ftqa"
      - "meta-ci"
    command: |
      set -euo pipefail
      unset VIRTUAL_ENV

      echo "--- :gear: Install sops"
      SOPS_VERSION=3.9.4
      curl -fsSL "https://github.com/getsops/sops/releases/download/v$${SOPS_VERSION}/sops-v$${SOPS_VERSION}.linux.amd64" -o /tmp/sops
      chmod +x /tmp/sops

      echo "--- :chalk: Install Chalk CLI"
      CHALK_CLI_VERSION=v1.40.0
      CHALK_CLI_DIR=/tmp/chalk-cli
      mkdir -p "$$CHALK_CLI_DIR"
      curl -fsSL "https://storage.googleapis.com/cli-go.chalk-prod.chalk.ai/$${CHALK_CLI_VERSION}/chalk-linux-amd64" -o "$$CHALK_CLI_DIR/chalk"
      chmod +x "$$CHALK_CLI_DIR/chalk"
      export PATH="$$CHALK_CLI_DIR:$$PATH"
      chalk version
      chalk metrics snapshot --help

      echo "--- :key: Decrypt secrets"
      if [ "{{matrix}}" = "staging/ftqa" ]; then ENV_FILE=".env.enc"; else ENV_FILE=".env.{{matrix}}.enc"; fi
      /tmp/sops --input-type dotenv --output-type dotenv -d "$$ENV_FILE" > /tmp/test.env
      set -a
      source /tmp/test.env
      set +a
      rm /tmp/test.env
      export CHALK_ACTIVE_ENVIRONMENT="$$CHALK_ENVIRONMENT_ID"
      export CHALK_ASSERT_CONTAINER_METRICS=1

      echo "--- :python: Sync dependencies"
      uv sync --all-extras --reinstall-package chalkcompute

      echo "--- :pytest: Run integration tests ($$CHALK_API_SERVER)"
      uv run python -m pytest e2etests/test_image.py e2etests/test_sandbox_exec.py e2etests/test_volume.py e2etests/test_container.py e2etests/test_remote_function_calls.py e2etests/test_remote_function_schedule.py -v -s --tb=short
    agents:
      queue: default
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1
          limit: 2

  - label: ":brain: Embedding function example ({{matrix}})"
    matrix:
      - "staging/ftqa"
      - "meta-ci"
    command: |
      set -euo pipefail
      unset VIRTUAL_ENV

      echo "--- :gear: Install sops"
      SOPS_VERSION=3.9.4
      curl -fsSL "https://github.com/getsops/sops/releases/download/v$${SOPS_VERSION}/sops-v$${SOPS_VERSION}.linux.amd64" -o /tmp/sops
      chmod +x /tmp/sops

      echo "--- :key: Decrypt secrets"
      if [ "{{matrix}}" = "staging/ftqa" ]; then ENV_FILE=".env.enc"; else ENV_FILE=".env.{{matrix}}.enc"; fi
      /tmp/sops --input-type dotenv --output-type dotenv -d "$$ENV_FILE" > /tmp/test.env
      set -a
      source /tmp/test.env
      set +a
      rm /tmp/test.env

      echo "--- :python: Sync dependencies"
      uv sync --all-extras --reinstall-package chalkcompute

      echo "--- :brain: Deploy and test embedding functions"
      export OTEL_EXPORTER_OTLP_ENDPOINT=https://telemetry.chalk.ai:443
      export OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      export OTEL_SERVICE_NAME=chalkcompute-ci-embedding
      CHALK_FUNCTION_STRIP_SOURCE=1 uv run python -m pytest examples/embedding-function/test_embedding_function.py -v -s --tb=short
    agents:
      queue: default
    timeout_in_minutes: 20
    retry:
      automatic:
        - exit_status: -1
          limit: 2

  - label: ":arrows_counterclockwise: Generator function example ({{matrix}})"
