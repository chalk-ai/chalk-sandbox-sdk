on:
  pull_request: {}
  push:
    branches:
      - main

env:
  UV_VERSION: "0.11.14"

steps:
  - label: ":docker: Compute integration tests ({{matrix}})"
    matrix:
      - "staging/ftqa"
      - "meta-ci"
    command: |
      set -euo pipefail
      unset VIRTUAL_ENV

      echo "--- :gear: Install sops"
      SOPS_VERSION=3.9.4
      curl -fsSL "https://github.com/getsops/sops/releases/download/v$${SOPS_VERSION}/sops-v$${SOPS_VERSION}.linux.amd64" -o /tmp/sops
      chmod +x /tmp/sops

      echo "--- :chalk: Install Chalk CLI"
      export CHALK_INSTALL=/tmp/chalk-cli
      export PATH="$$CHALK_INSTALL/bin:$$PATH"
      curl -fsSL https://api.chalk.ai/install.sh | sh
      chalk version
      chalk metrics snapshot --help

      echo "--- :key: Decrypt secrets"
      source .buildkite/select-env-file.sh "{{matrix}}"
      /tmp/sops --input-type dotenv --output-type dotenv -d "$$ENV_FILE" > /tmp/test.env
      set -a
      source /tmp/test.env
      set +a
      rm /tmp/test.env
      export CHALK_ACTIVE_ENVIRONMENT="$$CHALK_ENVIRONMENT_ID"
      export CHALK_ASSERT_CONTAINER_METRICS=1

      echo "--- :python: Bootstrap toolchain"
      source .buildkite/install-uv.sh
      echo "--- :package: Sync locked dependencies"
      uv sync --locked --all-extras --reinstall-package chalkcompute

      echo "--- :pytest: Run core integration tests ($$CHALK_API_SERVER)"
      uv run python -m pytest e2etests/test_image.py e2etests/test_sandbox_exec.py e2etests/test_container.py e2etests/test_mcp_eval_python.py -v -s --tb=short
    agents:
      queue: default
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1
          limit: 2

