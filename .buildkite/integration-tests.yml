  - label: ":brain: Embedding function example ({{matrix}})"
    matrix:
      - "staging/ftqa"
      - "meta-ci"
    command: |
      set -euo pipefail
      unset VIRTUAL_ENV

      echo "--- :gear: Install sops"
      SOPS_VERSION=3.9.4
      curl -fsSL "https://github.com/getsops/sops/releases/download/v$${SOPS_VERSION}/sops-v$${SOPS_VERSION}.linux.amd64" -o /tmp/sops
      chmod +x /tmp/sops

      echo "--- :key: Decrypt secrets"
      source .buildkite/select-env-file.sh "{{matrix}}"
      /tmp/sops --input-type dotenv --output-type dotenv -d "$$ENV_FILE" > /tmp/test.env
      set -a
      source /tmp/test.env
      set +a
      rm /tmp/test.env

      echo "--- :python: Bootstrap toolchain"
      source .buildkite/install-uv.sh
      echo "--- :package: Sync locked dependencies"
      uv sync --locked --all-extras --reinstall-package chalkcompute

      echo "--- :package: Build deployable SDK wheel"
      uv python install 3.14
      sdk_python="$$(uv python find 3.14)"
      wheel_dir="$$(mktemp -d)"
      uvx --python "$$sdk_python" --from 'maturin>=1.7,<2' maturin build \
        --release \
        --out "$$wheel_dir" \
        --interpreter "$$sdk_python"
      sdk_wheels=("$$wheel_dir"/*.whl)
      if [[ $${#sdk_wheels[@]} -ne 1 || ! -f "$${sdk_wheels[0]}" ]]; then
        echo "Expected exactly one SDK wheel in $$wheel_dir" >&2
        exit 1
      fi
      export CHALK_FUNCTION_LOCAL_SDK_WHEEL="$${sdk_wheels[0]}"
      export CHALK_FUNCTION_STRIP_SOURCE=0

      echo "--- :brain: Deploy and test embedding functions"
      export OTEL_EXPORTER_OTLP_ENDPOINT=https://telemetry.chalk.ai:443
      export OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      export OTEL_SERVICE_NAME=chalkcompute-ci-embedding
      uv run python -m pytest e2etests/test_embedding_function.py -v -s --tb=short
    agents:
      queue: default
    timeout_in_minutes: 20
    retry:
      automatic:
        - exit_status: -1
          limit: 2

