on:
  pull_request:
    branches:
      - sai/mount-local-for-testing
  push:
    branches:
      - sai/mount-local-for-testing

steps:
  - label: ":mag: ty type check"
    command: |
      set -euo pipefail
      echo "--- :python: Install dependencies"
      pip install ty
      echo "--- :mag: Run ty"
      ty check chalkcompute/ --exclude chalkcompute/_gen/
    agents:
      queue: default
    timeout_in_minutes: 5

  - label: ":pytest: Integration tests"
    command: |
      set -euo pipefail

      echo "--- :gear: Install sops"
      SOPS_VERSION=3.9.4
      curl -fsSL "https://github.com/getsops/sops/releases/download/v$${SOPS_VERSION}/sops-v$${SOPS_VERSION}.linux.amd64" -o /tmp/sops
      chmod +x /tmp/sops

      echo "--- :key: Decrypt secrets"
      /tmp/sops --input-type dotenv --output-type dotenv -d .env.enc > /tmp/test.env
      set -a
      source /tmp/test.env
      set +a
      rm /tmp/test.env

      echo "--- :python: Install dependencies"
      pip install pytest httpx python-dotenv grpcio grpcio-tools protobuf

      echo "--- :pytest: Run integration tests"
      pytest e2etests/test_image.py e2etests/test_sandbox_exec.py e2etests/test_volume.py e2etests/test_container.py -v -s --tb=short
    agents:
      queue: default
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1
          limit: 2

  - label: ":brain: Embedding function example"
    command: |
      set -euo pipefail

      echo "--- :gear: Install sops"
      SOPS_VERSION=3.9.4
      curl -fsSL "https://github.com/getsops/sops/releases/download/v$${SOPS_VERSION}/sops-v$${SOPS_VERSION}.linux.amd64" -o /tmp/sops
      chmod +x /tmp/sops

      echo "--- :key: Decrypt secrets"
      /tmp/sops --input-type dotenv --output-type dotenv -d .env.enc > /tmp/test.env
      set -a
      source /tmp/test.env
      set +a
      rm /tmp/test.env

      echo "--- :python: Install dependencies"
      pip install pytest python-dotenv httpx grpcio grpcio-tools protobuf
      pip install -e .

      echo "--- :brain: Deploy and test embedding functions"
      export OTEL_EXPORTER_OTLP_ENDPOINT=https://telemetry.chalk.ai:443
      export OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      export OTEL_SERVICE_NAME=chalkcompute-ci-embedding
      CHALK_FUNCTION_LOCAL_SDK_COPY=1 pytest examples/embedding-function/test_embedding_function.py -v -s --tb=short
    agents:
      queue: default
    timeout_in_minutes: 20
    retry:
      automatic:
        - exit_status: -1
          limit: 2
