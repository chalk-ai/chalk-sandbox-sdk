on:
  pull_request: {}

steps:
  - label: ":pytest: Integration tests"
    command: |
      set -euo pipefail

      echo "--- :key: Decrypt secrets"
      sops --input-type dotenv --output-type dotenv -d .env.enc > /tmp/test.env
      set -a
      source /tmp/test.env
      set +a
      rm /tmp/test.env

      echo "--- :python: Install dependencies"
      pip install pytest httpx python-dotenv grpcio grpcio-tools protobuf

      echo "--- :pytest: Run integration tests"
      pytest test_image.py -v -s --tb=short
    agents:
      queue: default
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1
          limit: 2
