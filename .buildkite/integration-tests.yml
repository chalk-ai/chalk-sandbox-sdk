on:
  pull_request: {}
  push:
    branches:
      - main

steps:
  - label: ":pytest: Integration tests"
    command: |
      set -euo pipefail

      echo "--- :gear: Install sops"
      SOPS_VERSION=3.9.4
      curl -fsSL "https://github.com/getsops/sops/releases/download/v$${SOPS_VERSION}/sops-v$${SOPS_VERSION}.linux.amd64" -o /tmp/sops
      chmod +x /tmp/sops

      echo "--- :key: Decrypt secrets"
      /tmp/sops --input-type dotenv --output-type dotenv -d .env.enc > /tmp/test.env
      set -a
      source /tmp/test.env
      set +a
      rm /tmp/test.env

      echo "--- :python: Sync dependencies"
      uv sync --all-extras

      echo "--- :pytest: Run integration tests"
      uv run python -m pytest e2etests/test_image.py e2etests/test_sandbox_exec.py e2etests/test_volume.py e2etests/test_container.py -v -s --tb=short
    agents:
      queue: default
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1
          limit: 2

  - label: ":brain: Embedding function example"
    command: |
      set -euo pipefail

      echo "--- :gear: Install sops"
      SOPS_VERSION=3.9.4
      curl -fsSL "https://github.com/getsops/sops/releases/download/v$${SOPS_VERSION}/sops-v$${SOPS_VERSION}.linux.amd64" -o /tmp/sops
      chmod +x /tmp/sops

      echo "--- :key: Decrypt secrets"
      /tmp/sops --input-type dotenv --output-type dotenv -d .env.enc > /tmp/test.env
      set -a
      source /tmp/test.env
      set +a
      rm /tmp/test.env

      echo "--- :python: Sync dependencies"
      uv sync --all-extras

      echo "--- :brain: Deploy and test embedding functions"
      export OTEL_EXPORTER_OTLP_ENDPOINT=https://telemetry.chalk.ai:443
      export OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      export OTEL_SERVICE_NAME=chalkcompute-ci-embedding
      CHALK_FUNCTION_STRIP_SOURCE=1 uv run python -m pytest examples/embedding-function/test_embedding_function.py -v -s --tb=short
    agents:
      queue: default
    timeout_in_minutes: 20
    retry:
      automatic:
        - exit_status: -1
          limit: 2

  - label: ":arrows_counterclockwise: Generator function example"
    command: |
      set -euo pipefail

      echo "--- :gear: Install sops"
      SOPS_VERSION=3.9.4
      curl -fsSL "https://github.com/getsops/sops/releases/download/v$${SOPS_VERSION}/sops-v$${SOPS_VERSION}.linux.amd64" -o /tmp/sops
      chmod +x /tmp/sops

      echo "--- :key: Decrypt secrets"
      /tmp/sops --input-type dotenv --output-type dotenv -d .env.enc > /tmp/test.env
      set -a
      source /tmp/test.env
      set +a
      rm /tmp/test.env

      echo "--- :python: Sync dependencies"
      uv sync --all-extras

      echo "--- :arrows_counterclockwise: Deploy and test generator functions"
      CHALK_FUNCTION_STRIP_SOURCE=1 uv run python -m pytest examples/generator/test_generator.py -v -s --tb=short
    agents:
      queue: default
    timeout_in_minutes: 20
    retry:
      automatic:
        - exit_status: -1
          limit: 2
