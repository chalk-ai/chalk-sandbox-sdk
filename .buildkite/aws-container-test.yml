on:
  pull_request: {}
  push:
    branches:
      - main

steps:
  - label: ":aws: Trivial Container test (AWS env)"
    command: |
      set -euo pipefail
      unset VIRTUAL_ENV

      echo "--- :gear: Install sops"
      SOPS_VERSION=3.9.4
      curl -fsSL "https://github.com/getsops/sops/releases/download/v$${SOPS_VERSION}/sops-v$${SOPS_VERSION}.linux.amd64" -o /tmp/sops
      chmod +x /tmp/sops

      echo "--- :key: Decrypt AWS secrets"
      /tmp/sops --input-type dotenv --output-type dotenv -d .env_aws.enc > /tmp/aws.env
      set -a
      source /tmp/aws.env
      set +a
      rm /tmp/aws.env

      echo "--- :python: Sync dependencies"
      uv sync --all-extras

      echo "--- :pytest: Run trivial AWS Container test"
      uv run python -m pytest e2etests/test_container_aws.py -v -s --tb=short
    agents:
      queue: default
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1
          limit: 2
