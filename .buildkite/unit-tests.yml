on:
  pull_request: {}
  push:
    branches:
      - main
      - "**"

env:
  UV_VERSION: "0.11.14"

steps:
  - label: ":mag: Static checks"
    command: |
      set -euo pipefail
      unset VIRTUAL_ENV
      echo "--- :python: Install uv"
      source .buildkite/install-uv.sh
      echo "--- :python: Sync dependencies"
      uv sync --locked --all-extras
      echo "--- :ruff: Check formatting"
      uv run --with ruff ruff format --check chalkcompute tests e2etests
      echo "--- :ruff: Run lint"
      uv run --with ruff ruff check chalkcompute tests e2etests
      echo "--- :mag: Run ty"
      uv run --with ty ty check chalkcompute/ --exclude chalkcompute/_gen/
    agents:
      queue: default
    timeout_in_minutes: 5

  - label: ":pytest: Unit tests"
    command: |
      set -euo pipefail
      unset VIRTUAL_ENV
      echo "--- :python: Install uv"
      source .buildkite/install-uv.sh
      echo "--- :python: Sync dependencies"
      uv sync --locked --all-extras
      echo "--- :pytest: Run unit tests"
      uv run python -m pytest tests/ -v --tb=short
    agents:
      queue: default
    timeout_in_minutes: 5
