env:
  UV_VERSION: "0.11.14"
  BENCHMARK_RESULTS_URL: "https://benchmark-results-server-290587571767.us-central1.run.app"
  ARTIFACT_GCS_BUCKET: "chalk-ci-artifact-cache"

steps:
  # To add a new benchmark:
  #   1. Write a module that emits pyperf JSON to $CHALK_BENCHMARK_PYPERF_OUTPUT
  #   2. Add a step that sources setup-benchmark-env.sh then calls run-benchmark.sh

  - label: ":bar_chart: Sandbox TTI ({{matrix}})"
    matrix:
      - "staging/ftqa"
      - "meta-ci"
    command: |
      source .buildkite/select-env-file.sh "{{matrix}}"
      source .buildkite/setup-benchmark-env.sh
      .buildkite/run-benchmark.sh \
        --suite "Sandbox TTI Benchmarks ({{matrix}})" \
        --case  "sandbox-tti" \
        --tags  "sandbox,compute,tti,{{matrix}}" \
        -- uv run python -m sandbox_benchmark.pyperf_adapter \
          --mode all \
          --iterations 5 \
          --cpu 250m \
          --memory 128Mi \
          --min-success-rate 1.0 \
          --max-p95-ms 60000
    agents:
      queue: default
    timeout_in_minutes: 60
    retry:
      automatic:
        - exit_status: -1
          limit: 2

  - label: ":bar_chart: Volume FIO ({{matrix}})"
    matrix:
      - "staging/ftqa"
      - "meta-ci"
    command: |
      source .buildkite/select-env-file.sh "{{matrix}}"
      source .buildkite/setup-benchmark-env.sh
      .buildkite/run-benchmark.sh \
        --suite "Sandbox Volume FIO Benchmarks ({{matrix}})" \
        --case  "volume-fio" \
        --tags  "sandbox,volume,fio,{{matrix}}" \
        -- uv run python -m e2etests.volume.fio_benchmark \
          --size 1G \
          --jobs 1 \
          --small-files 1000 \
          --small-file-size 4k \
          --direct 1 \
          --cpu 2 \
          --memory 4Gi
    agents:
      queue: default
    timeout_in_minutes: 90
    notify:
      - slack:
          channels:
            - "#proj-compute-volumes"
          message: ":floppy_disk: <@U0AT4JH64Q4> sandbox volume fio benchmark failed on main."
        if: build.branch == "main" && step.outcome == "hard_failed"
    retry:
      automatic:
        - exit_status: -1
          limit: 2
