name: Publish to PyPI

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      skip_publish:
        description: "Skip publishing to PyPI (only build wheels)"
        type: boolean
        default: true

jobs:
  build-wheels:
    name: "Build wheels (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw_archs_linux: "x86_64"
          - os: macos-latest
            cibw_archs_macos: "arm64"
            macos_deployment_target: "11.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Configure Cargo access to chalk-private (host)
        shell: bash
        env:
          CHALK_PRIVATE_READ_TOKEN: ${{ secrets.CHALK_PRIVATE_READ_TOKEN }}
        run: |
          if [ -z "$CHALK_PRIVATE_READ_TOKEN" ]; then
            echo "CHALK_PRIVATE_READ_TOKEN must be a GitHub token with read access to chalk-ai/chalk-private." >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${CHALK_PRIVATE_READ_TOKEN}@github.com/chalk-ai/chalk-private.git".insteadOf "https://github.com/chalk-ai/chalk-private.git"

      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          # BSD/macOS-compatible in-place edit
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          rm -f pyproject.toml.bak

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.4
        env:
          CHALK_PRIVATE_READ_TOKEN: ${{ secrets.CHALK_PRIVATE_READ_TOKEN }}
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_* *-win32 *_i686"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: |
            set -euo pipefail
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            dnf install -y git unzip curl
            curl -fsSLo /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-linux-x86_64.zip
            mkdir -p /opt/protoc
            unzip -q /tmp/protoc.zip -d /opt/protoc
            git config --global url."https://x-access-token:${CHALK_PRIVATE_READ_TOKEN}@github.com/chalk-ai/chalk-private.git".insteadOf "https://github.com/chalk-ai/chalk-private.git"
          CIBW_ENVIRONMENT_LINUX: 'PATH=/opt/protoc/bin:$HOME/.cargo/bin:$PATH PROTOC=/opt/protoc/bin/protoc'
          CIBW_ENVIRONMENT_PASS_LINUX: "CHALK_PRIVATE_READ_TOKEN"
          CIBW_ARCHS_LINUX: "${{ matrix.cibw_archs_linux || 'native' }}"
          CIBW_ARCHS_MACOS: "${{ matrix.cibw_archs_macos || 'native' }}"
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target || '11.0' }}"

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          for whl in wheelhouse/*.whl; do
            echo "=== $whl ==="
            python3 -m zipfile -l "$whl"
            if python3 -m zipfile -l "$whl" | grep -qiE '\.env|\.enc|sops|test_'; then
              echo "ERROR: Sensitive or test files found in wheel!"
              exit 1
            fi
          done

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.cibw_archs_linux || matrix.cibw_archs_macos || 'default' }}
          path: wheelhouse

  build-sdist:
    name: "Build source distribution"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure Cargo access to chalk-private
        env:
          CHALK_PRIVATE_READ_TOKEN: ${{ secrets.CHALK_PRIVATE_READ_TOKEN }}
        run: |
          if [ -z "$CHALK_PRIVATE_READ_TOKEN" ]; then
            echo "CHALK_PRIVATE_READ_TOKEN must be a GitHub token with read access to chalk-ai/chalk-private." >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${CHALK_PRIVATE_READ_TOKEN}@github.com/chalk-ai/chalk-private.git".insteadOf "https://github.com/chalk-ai/chalk-private.git"

      - name: Set version from release tag
        if: github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: "Publish to PyPI"
    needs: [build-wheels, build-sdist]
    if: github.event_name == 'release' || inputs.skip_publish == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
