name: Publish to PyPI

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      skip_publish:
        description: "Skip publishing to PyPI (only build wheels)"
        type: boolean
        default: true

jobs:
  build:
    name: "Build wheel (${{ matrix.os_name }} py${{ matrix.python_version }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            python_version: "3.12"
            manylinux: "2_28"
          - os: [self-hosted, macOS, ARM64]
            os_name: macos-arm64
            python_version: "3.11"
          - os: [self-hosted, macOS, ARM64]
            os_name: macos-arm64
            python_version: "3.12"
          - os: [self-hosted, macOS, ARM64]
            os_name: macos-arm64
            python_version: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure Cargo access to chalk-private
        env:
          CHALK_PRIVATE_READ_TOKEN: ${{ secrets.CHALK_PRIVATE_READ_TOKEN }}
        run: |
          if [ -z "$CHALK_PRIVATE_READ_TOKEN" ]; then
            echo "CHALK_PRIVATE_READ_TOKEN must be a GitHub token with read access to chalk-ai/chalk-private." >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${CHALK_PRIVATE_READ_TOKEN}@github.com/chalk-ai/chalk-private.git".insteadOf "https://github.com/chalk-ai/chalk-private.git"

      - name: Diagnose macOS runner
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -x
          uname -a
          whoami
          echo "HOME=$HOME"
          echo "PATH=$PATH"
          xcode-select -p 2>&1 || true
          ls -d /Applications/Xcode*.app 2>&1 || true
          ls /Library/Developer/CommandLineTools 2>&1 || true
          xcrun --sdk macosx --show-sdk-path 2>&1 || true
          for v in 3.11 3.12 3.13; do
            echo "--- python$v ---"
            command -v "python$v" 2>&1 || true
            ls -la "/opt/homebrew/bin/python$v" 2>&1 || true
            ls -d "/Library/Frameworks/Python.framework/Versions/$v" 2>&1 || true
            "python$v" --version 2>&1 || true
          done
          command -v brew 2>&1 || true
          command -v uv 2>&1 || true
          command -v protoc 2>&1 || true

      - name: Set up Python (linux)
        if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          protoc --version

      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          # BSD/macOS-compatible in-place edit
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          rm -f pyproject.toml.bak

      - name: Build (linux)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        env:
          CHALK_PRIVATE_READ_TOKEN: ${{ secrets.CHALK_PRIVATE_READ_TOKEN }}
        with:
          command: build
          args: --release --sdist --out dist -i python${{ matrix.python_version }}
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e CHALK_PRIVATE_READ_TOKEN -e PROTOC=/opt/protoc/bin/protoc
          before-script-linux: |
            set -euo pipefail
            dnf install -y git curl unzip
            curl -fsSLo /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-linux-x86_64.zip
            mkdir -p /opt/protoc
            unzip -q /tmp/protoc.zip -d /opt/protoc
            /opt/protoc/bin/protoc --version
            git config --global url."https://x-access-token:${CHALK_PRIVATE_READ_TOKEN}@github.com/chalk-ai/chalk-private.git".insteadOf "https://github.com/chalk-ai/chalk-private.git"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        uses: PyO3/maturin-action@v1
        env:
          CHALK_PRIVATE_READ_TOKEN: ${{ secrets.CHALK_PRIVATE_READ_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        with:
          command: build
          args: --release --out dist -i python${{ matrix.python_version }}
          target: aarch64-apple-darwin

      - name: Verify package contents
        shell: bash
        run: |
          echo "=== Wheel contents ==="
          python -m zipfile -l dist/*.whl
          echo ""
          echo "=== Checking for sensitive files ==="
          if python -m zipfile -l dist/*.whl | grep -qiE '\.env|\.enc|sops|test_'; then
            echo "ERROR: Sensitive or test files found in wheel!"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os_name }}-py${{ matrix.python_version }}
          path: dist/

  publish:
    name: "Publish to PyPI"
    needs: build
    if: github.event_name == 'release' || inputs.skip_publish == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
