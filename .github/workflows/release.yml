name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "PEP 440 version to publish (e.g. 0.1.0)"
        required: true
        type: string

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set version
        run: |
          sed -i "s/^version = .*/version = \"${{ inputs.version }}\"/" pyproject.toml

      - name: Build
        run: |
          pip install hatchling build
          python -m build

      - name: Verify package contents
        run: |
          echo "=== Wheel contents ==="
          python -m zipfile -l dist/*.whl
          echo ""
          echo "=== Checking for sensitive files ==="
          if python -m zipfile -l dist/*.whl | grep -qiE '\.env|\.enc|sops|test_'; then
            echo "ERROR: Sensitive or test files found in wheel!"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
