name: Publish to PyPI

on:
  release:
    types:
      - "published"

jobs:
  build:
    name: "Build distribution"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure Cargo access to chalk-private
        env:
          CHALK_PRIVATE_READ_TOKEN: ${{ secrets.CHALK_PRIVATE_READ_TOKEN }}
        run: |
          if [ -z "$CHALK_PRIVATE_READ_TOKEN" ]; then
            echo "CHALK_PRIVATE_READ_TOKEN must be a GitHub token with read access to chalk-ai/chalk-private." >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${CHALK_PRIVATE_READ_TOKEN}@github.com/chalk-ai/chalk-private.git".insteadOf "https://github.com/chalk-ai/chalk-private.git"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

      - name: Build
        run: |
          pip install hatchling build
          python -m build

      - name: Verify package contents
        run: |
          echo "=== Wheel contents ==="
          python -m zipfile -l dist/*.whl
          echo ""
          echo "=== Checking for sensitive files ==="
          if python -m zipfile -l dist/*.whl | grep -qiE '\.env|\.enc|sops|test_'; then
            echo "ERROR: Sensitive or test files found in wheel!"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: "Publish to PyPI"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
