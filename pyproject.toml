[project]
name = "chalkcompute"
version = "0.1.0"
description = "SDK for Chalk sandboxes, containers, and volumes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["chalkcompute/", "pyproject.toml", "README.md"]
exclude = ["examples/", ".env*", ".sops.yaml", "test_*", "*.enc"]

[tool.hatch.build.targets.wheel]
packages = ["chalkcompute"]

[dependency-groups]
dev = [
    "chalkpy[runtime]>=2.113.7",
    "python-dotenv>=1.1.0",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]
