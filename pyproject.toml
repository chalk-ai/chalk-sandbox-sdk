[project]
name = "chalkcompute"
version = "0.0.0"
description = "SDK for Chalk sandboxes, containers, and volumes"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "grpcio>=1.60.0",
    "httpx>=0.25.0",
    "blake3>=1.0.0",
    "chalk-remote-call-python>=1.8.7",
    "pyyaml>=6.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "rich>=13.0.0",
    "protobuf-py==0.1.1",
    "connectrpc==0.11.1",
]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.hatch.build.targets.sdist]
include = ["chalkcompute/", "pyproject.toml", "README.md"]
exclude = ["examples/", ".env*", ".sops.yaml", "e2etests/", "test_*", "*.enc"]

[tool.hatch.build.targets.wheel]
packages = ["chalkcompute"]

[tool.maturin]
manifest-path = "rust/chalkcompute_native/Cargo.toml"
module-name = "chalkcompute._native"
python-source = "."
include = ["chalkcompute/**", "README.md"]
exclude = ["examples/", ".env*", ".sops.yaml", "e2etests/", "test_*", "*.enc"]

[project.optional-dependencies]
dev = [
    "attrs>=23.0.0",
    "chalkdf>=3.31.87",
    "chalkpy[runtime]>=2.114.0",
    "python-dotenv>=1.1.0",
    "pytest>=9.0.2",
]

[tool.ruff]
extend-exclude = ["chalkcompute/_gen"]

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E501"]

[tool.ty.environment]
python = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "e2etests"]
