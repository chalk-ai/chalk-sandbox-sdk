[package]
name = "chalkcompute_remote_client"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "_remote_call_native"
crate-type = ["cdylib"]

[dependencies]
bytes = "1"
chalk_remote_call = { package = "chalk_remote_call_client", git = "https://github.com/chalk-ai/chalk-private.git", rev = "ebd180ea8d7e04f8e18187c73cac0f59828db199" }
pyo3 = { version = "0.25.1", features = ["abi3-py311", "extension-module"] }
