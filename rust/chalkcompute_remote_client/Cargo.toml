[dependencies]
bytes = "1"
chalk_remote_call = { package = "chalk_remote_call_client", git = "https://github.com/chalk-ai/chalk-private.git", rev = "2c2001f01a8296c720f1b716463a31928a984cd6" }
pyo3 = { version = "0.25.1", features = ["extension-module"] }
