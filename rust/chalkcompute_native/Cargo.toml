[package]
name = "chalkcompute_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
bytes = "1"

chalk_remote_call = { package = "chalk_remote_call_client", git = "https://github.com/chalk-ai/chalk-private.git", rev = "aa2f3a09b36" }
chalk_notebook_analysis = { git = "https://github.com/chalk-ai/chalk-private.git", rev = "dc85a4fc270c2107393a8357ea0f6fdff836a630" }
chalk_volume_client = { git = "https://github.com/chalk-ai/chalk-private.git", rev = "9a760cc18c4bea5f06888a8cad51afc9bfb7aa77", features = ["py-extension"] }

pyo3 = { version = "0.25.1", features = ["extension-module"] }
tonic = { version = "0.9.2", default-features = false }
