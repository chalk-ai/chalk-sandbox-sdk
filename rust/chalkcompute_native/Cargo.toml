[package]
name = "chalkcompute_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
bytes = "1"
chalk_remote_call = { package = "chalk_remote_call_client", git = "https://github.com/chalk-ai/chalk-private.git", rev = "49c04ac2c42" }
chalk_volume_client = { git = "https://github.com/chalk-ai/chalk-private.git", rev = "ae42e022cf1645efc8ee72eb60a97d9937317d11", features = ["py-extension"] }
pyo3 = { version = "0.25.1", features = ["extension-module"] }
tonic = { version = "0.9.2", default-features = false }
