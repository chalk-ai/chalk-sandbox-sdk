[package]
name = "chalkcompute_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
bytes = "1"
#TEMP CHANGE
chalk_remote_call = { package = "chalk_remote_call_client", git = "https://github.com/chalk-ai/chalk-private.git", rev = "ecb71cb180ff2834cdc912ef4d55aa316488d95e" }
#chalk_remote_call = { package = "chalk_remote_call_client", git = "https://github.com/chalk-ai/chalk-private.git", rev = "49c04ac2c42" }
chalk_volume_client = { git = "https://github.com/chalk-ai/chalk-private.git", rev = "ef1a9ab9c6d2aa02f6e7e98274fbb2642e637466", features = ["py-extension"] }
pyo3 = { version = "0.25.1", features = ["extension-module"] }
tonic = { version = "0.9.2", default-features = false }
