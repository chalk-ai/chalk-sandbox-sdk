[package]
name = "chalkcompute_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
bytes = "1"
chalk_remote_call = { package = "chalk_remote_call_client", git = "https://github.com/chalk-ai/chalk-private.git", rev = "49c04ac2c42" }
chalk_volume_client = { git = "https://github.com/chalk-ai/chalk-private.git", rev = "ba32430a645c31fa6b7b1c25e08c4dfef9056838", features = ["py-extension"] }
pyo3 = { version = "0.25.1", features = ["extension-module"] }
