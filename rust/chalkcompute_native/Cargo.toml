[package]
name = "chalkcompute_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
bytes = "1"

chalk_remote_call = { package = "chalk_remote_call_client", git = "https://github.com/chalk-ai/chalk-private.git", rev = "c560738ad14c1774c05dd0e844e8a1dcc86a0d6e" }
chalk_notebook_analysis = { git = "https://github.com/chalk-ai/chalk-private.git", rev = "dc85a4fc270c2107393a8357ea0f6fdff836a630" }
chalk_volume_client = { git = "https://github.com/chalk-ai/chalk-private.git", rev = "6f0f9f49cfa164cc2d0dbc32ac8ad62e07c7ef7a", features = ["py-extension"] }

pyo3 = { version = "0.26.0", features = ["extension-module"] }
tonic = { version = "0.9.2", default-features = false }
