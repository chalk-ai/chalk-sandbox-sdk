syntax = "proto3";

package chalk.sandbox.v1;

// ExecRequest is the bidirectional streaming request for executing commands in a sandbox.
// The first message must be an init message with sandbox_id and command details.
// Subsequent messages contain stdin data, stdin EOF, or signals.
message ExecRequest {
  oneof message {
    // Initial request to start command execution
    ExecInit init = 1;

    // Stdin data to send to the process
    StdinData stdin_data = 2;

    // Signal that stdin is closed
    StdinEof stdin_eof = 3;

    // Send a signal to the process
    ExecSignal signal = 4;
  }
}

// Initial configuration for executing a command in a sandbox
message ExecInit {
  // The sandbox to execute the command in
  string sandbox_id = 1;

  // The command to execute
  string command = 2;

  // Arguments to the command
  repeated string args = 3;

  // Optional working directory
  optional string workdir = 4;

  // Optional environment variables
  map<string, string> env = 5;

  // Optional timeout in seconds
  optional uint64 timeout_secs = 6;
}

// Stdin data to send to the running process
message StdinData {
  bytes data = 1;
}

// Signal that stdin is closed
message StdinEof {}

// Send a signal to the running process
message ExecSignal {
  int32 signal = 1;
}

// ExecResponse is the bidirectional streaming response for command execution.
message ExecResponse {
  oneof message {
    // Process has started
    ProcessStarted process_started = 1;

    // Output data from stdout or stderr
    OutputData output_data = 2;

    // Process has exited
    ProcessExited process_exited = 3;

    // An error occurred
    ExecError error = 4;
  }
}

// Notification that the process has started
message ProcessStarted {
  uint32 pid = 1;
}

// Output data from the process
message OutputData {
  enum Stream {
    STREAM_UNSPECIFIED = 0;
    STREAM_STDOUT = 1;
    STREAM_STDERR = 2;
  }

  Stream stream = 1;
  bytes data = 2;
}

// Notification that the process has exited
message ProcessExited {
  optional int32 exit_code = 1;
  optional int32 signal = 2;
}

// Error from sandbox execution
message ExecError {
  string code = 1;
  string message = 2;
}

// A declarative image specification built from composable steps.
// Transmitted to the server which builds the image before starting the sandbox.
message ImageSpec {
  // Base image (e.g. "python:3.12-slim-bookworm")
  string base_image = 1;

  // Ordered build steps applied on top of the base image
  repeated BuildStep steps = 2;

  // Override container entrypoint
  repeated string entrypoint = 3;

  // Override container cmd
  repeated string cmd = 4;

  // Set the working directory in the final image
  optional string workdir = 5;

  // Environment variables baked into the image
  map<string, string> env = 6;
}

// A single build step in a declarative image specification.
message BuildStep {
  oneof step {
    RunCommandsStep run_commands = 1;
    PipInstallStep pip_install = 2;
    AddFileStep add_file = 3;
    DockerfileCommandsStep dockerfile_commands = 4;
  }
}

// Execute shell commands during the image build (each becomes a RUN layer).
message RunCommandsStep {
  repeated string commands = 1;
}

// Install Python packages via pip.
message PipInstallStep {
  repeated string packages = 1;
}

// Add a file with inline content to the image.
message AddFileStep {
  // Absolute destination path in the image
  string destination = 1;

  // File content
  bytes content = 2;

  // Optional file mode (e.g. 0o755). Defaults to 0644.
  optional uint32 mode = 3;
}

// Raw Dockerfile instructions injected verbatim.
message DockerfileCommandsStep {
  repeated string commands = 1;
}

// Request to create a new sandbox
message CreateSandboxRequest {
  // Container image to use for the sandbox — either a pre-built image reference
  // or a declarative image spec that the server will build.
  oneof image_source {
    // Pre-built container image reference (e.g. "ubuntu:latest")
    string image = 1;

    // Declarative image specification
    ImageSpec image_spec = 5;
  }

  // Optional resource limits
  optional ResourceLimits resource_limits = 2;

  // Optional environment variables to inject
  map<string, string> env = 3;

  // Optional name for the sandbox
  optional string name = 4;
}

// Resource limits for the sandbox
message ResourceLimits {
  optional string cpu = 1;
  optional string memory = 2;
}

// Response from creating a sandbox
message CreateSandboxResponse {
  SandboxInfo sandbox = 1;
}

// Request to terminate a sandbox
message TerminateSandboxRequest {
  string sandbox_id = 1;
  optional int32 grace_period_seconds = 2;
}

// Response from terminating a sandbox
message TerminateSandboxResponse {}

// Request to get a sandbox by ID
message GetSandboxRequest {
  string sandbox_id = 1;
}

// Response containing sandbox info
message GetSandboxResponse {
  SandboxInfo sandbox = 1;
}

// Request to list sandboxes
message ListSandboxesRequest {}

// Response containing a list of sandboxes
message ListSandboxesResponse {
  repeated SandboxInfo sandboxes = 1;
}

// Information about a sandbox
message SandboxInfo {
  string id = 1;
  string state = 2;
  string created_at = 3;
  optional string name = 4;
  // Build ID for sandboxes created with image_spec (e.g. Argo workflow name).
  // Present when state is "building" or after the build completes.
  optional string build_id = 5;
}

service SandboxService {
  // Exec establishes a bidirectional streaming session to execute commands in a sandbox.
  rpc Exec(stream ExecRequest) returns (stream ExecResponse);

  // CreateSandbox provisions a new sandbox pod
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);

  // TerminateSandbox stops and removes a sandbox
  rpc TerminateSandbox(TerminateSandboxRequest) returns (TerminateSandboxResponse);

  // GetSandbox returns information about a specific sandbox
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse);

  // ListSandboxes returns all sandboxes for the current environment
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);
}
