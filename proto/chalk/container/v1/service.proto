syntax = "proto3";

package chalk.container.v1;

import "chalk/auth/v1/permissions.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "container/v1;containerv1";

message ResourceLimits {
  // CPU limit, e.g., "2" or "500m"
  optional string cpu = 1;
  // Memory limit, e.g., "4Gi" or "512Mi"
  optional string memory = 2;
  // GPU request: "type:count" (e.g., "nvidia-tesla-t4:1", "h100:2"),
  // "type" (e.g., "h100", implies count of 1), or "count" (e.g., "1")
  optional string gpu = 3;
}

// VolumeMount describes a volume to mount into a container
message VolumeMount {
  // Name of the volume (used for identification)
  string name = 1;

  // Path inside the container where the volume should be mounted
  string mount_path = 2;

  // Type of volume: "empty_dir", "shared_memory", or "chalkfs"
  // "chalkfs" volumes inject a FUSE sidecar that mounts a remote ChalkFS volume.
  // Requires CHALK_CLIENT_ID, CHALK_CLIENT_SECRET, and VOLUME_SERVICE_URL in env_vars.
  string type = 3;

  // Size limit for the volume (e.g., "2Gi"). Required for empty_dir and shared_memory.
  optional string size_limit = 4;
}

// ChalkContainerSpec contains the immutable specification of what to run
message ChalkContainerSpec {
  // Unique name for the container (unique per environment)
  string name = 1;

  // The Docker image to run
  string image = 2;

  // The entrypoint command and arguments
  repeated string entrypoint = 3;

  // User-defined tags (key-value pairs)
  map<string, string> tags = 4;

  // Optional port to expose from the main container
  optional int32 port = 5;

  // How long the container should run before being terminated
  // A value of 0 means infinity (no automatic termination)
  optional google.protobuf.Duration lifetime = 6;

  // Optional resource limits for CPU and memory
  optional ResourceLimits resources = 7;

  // Enable SSH access to the container (defaults to false)
  optional bool enable_ssh = 8;

  // Environment variables to inject into the container
  map<string, string> env_vars = 9;

  // Volumes to mount into the container
  repeated VolumeMount volumes = 10;

  // Protocol the backend speaks: "http" (default) or "grpc".
  optional string protocol = 11;

  // The routing mode for the container (defaults to PUBLIC)
  optional string routing = 12; // PUBLIC, PRIVATE

  // Authentication mode for the container's HTTP route (defaults to UNAUTHENTICATED)
  // When set to AUTHENTICATED, creates an Envoy Gateway SecurityPolicy with JWT validation
  optional string authentication = 13; // UNAUTHENTICATED, AUTHENTICATED
}

message ContainerRequest {
  // Container specification - immutable properties defining what to run
  ChalkContainerSpec spec = 1;
}

// Result of an HTTP healthcheck against a container's exposed port
message HealthCheck {
  // Whether the container responded with HTTP 200
  bool healthy = 1;

  // HTTP status code returned, if any
  optional int32 status_code = 2;

  // Error message if the healthcheck failed (connection refused, timeout, etc.)
  optional string error = 3;
}

message ContainerResponse {
  // Container UUID (generated)
  string id = 1;

  // User-provided name
  string name = 2;

  // Container status: Pending, Running, Succeeded, Failed, Unknown
  string status = 3;

  // Optional status message with more details
  optional string status_message = 4;

  // The immutable specification that was provided at creation time
  ChalkContainerSpec spec = 5;

  // When the container was created
  google.protobuf.Timestamp created_at = 6;

  // When the container was stopped (if stopped)
  optional google.protobuf.Timestamp stopped_at = 7;

  // Kubernetes pod name (computed)
  string pod_name = 8;

  // Web URL to access the container (computed, if available)
  optional string web_url = 9;

  // SSH private key (PEM format) - only returned once during creation
  optional string ssh_private_key = 10;

  // SSH username for connection
  optional string ssh_username = 11;

  // SSH host (LoadBalancer IP or hostname)
  optional string ssh_host = 12;

  // SSH port
  optional int32 ssh_port = 13;

  // Result of an HTTP healthcheck against the container's web_url
  // Only populated for containers with an exposed port and web_url
  optional HealthCheck health_check = 14;

  // Optional scaling group ID that this container belongs to
  optional string scaling_group_id = 15;
}

message RunContainerRequest {
  ContainerRequest container = 1;
}

message RunContainerResponse {
  ContainerResponse container = 1;
}

message StopContainerRequest {
  // The container ID to stop (either id or name must be provided)
  optional string id = 1;

  // The container name to stop (either id or name must be provided)
  optional string name = 2;

  // Optional grace period in seconds for container termination
  optional int32 grace_period_seconds = 3;
}

message StopContainerResponse {
  ContainerResponse container = 1;
}

message GetContainerRequest {
  // The container ID to get (either id or name must be provided)
  optional string id = 1;

  // The container name to get (either id or name must be provided)
  optional string name = 2;
}

message GetContainerResponse {
  ContainerResponse container = 1;
}

message ListContainersRequest {
  // Optional scaling group ID to filter containers by
  optional string scaling_group_id = 1;
}

message ListContainersResponse {
  repeated ContainerResponse containers = 1;
}

message ExecCommandRequest {
  // The container ID to execute the command in (either id or name must be provided)
  optional string id = 1;

  // The container name to execute the command in (either id or name must be provided)
  optional string name = 2;

  // The command to execute (e.g., ["sh", "-c", "echo hello"])
  repeated string command = 3;

  // Optional timeout for the command execution
  optional google.protobuf.Duration timeout = 4;

  // Optional stdin data to pass to the command
  optional bytes stdin = 5;
}

message ExecCommandResponse {
  // The stdout output from the command
  bytes stdout = 1;

  // The stderr output from the command
  bytes stderr = 2;

  // The exit code of the command
  int32 exit_code = 3;
}

message UpdateContainerStatusRequest {
  // Container UUID (from pod label chalk.ai/container)
  string container_id = 1;

  // Pod phase: Pending, Running, Succeeded, Failed, Unknown
  string status = 2;

  // Optional status message with more details
  optional string status_message = 3;
}

message UpdateContainerStatusResponse {
  ContainerResponse container = 1;
}

service ContainerService {
  // RunContainer creates and runs a new container as a Kubernetes pod
  rpc RunContainer(RunContainerRequest) returns (RunContainerResponse) {
    option (chalk.auth.v1.permission) = PERMISSION_DEPLOY_CREATE;
  }

  // StopContainer stops and deletes a running container
  rpc StopContainer(StopContainerRequest) returns (StopContainerResponse) {
    option (chalk.auth.v1.permission) = PERMISSION_DEPLOY_REDEPLOY;
  }

  // GetContainer retrieves the status of a specific container
  rpc GetContainer(GetContainerRequest) returns (GetContainerResponse) {
    option (chalk.auth.v1.permission) = PERMISSION_DEPLOY_READ;
  }

  // ListContainers lists all containers created by this service
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse) {
    option (chalk.auth.v1.permission) = PERMISSION_DEPLOY_READ;
  }

  // ExecCommand executes a command in a running container
  rpc ExecCommand(ExecCommandRequest) returns (ExecCommandResponse) {
    option (chalk.auth.v1.permission) = PERMISSION_DEPLOY_REDEPLOY;
  }

  // UpdateContainerStatus updates container status from K8s controller
  rpc UpdateContainerStatus(UpdateContainerStatusRequest) returns (UpdateContainerStatusResponse) {
    option (chalk.auth.v1.permission) = PERMISSION_DEPLOY_REDEPLOY;
  }
}
