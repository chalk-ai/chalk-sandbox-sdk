syntax = "proto3";

package chalk.volume.v1;

import "chalk/auth/v1/permissions.proto";
import "google/protobuf/timestamp.proto";

option go_package = "volume/v1;volumev1";

// VolumeInfo describes a named volume.
message VolumeInfo {
  string name = 1;
  google.protobuf.Timestamp created_at = 2;
}

// FileInfo describes a single file inside a volume.
message FileInfo {
  string path = 1;
  int64 size = 2;
  google.protobuf.Timestamp updated_at = 3;
}

// ---------- Volume lifecycle ----------

message CreateVolumeRequest {
  string name = 1;
}
message CreateVolumeResponse {
  VolumeInfo volume = 1;
}

message GetVolumeRequest {
  string name = 1;
}
message GetVolumeResponse {
  VolumeInfo volume = 1;
}

message ListVolumesRequest {}
message ListVolumesResponse {
  repeated VolumeInfo volumes = 1;
}

message DeleteVolumeRequest {
  string name = 1;
}
message DeleteVolumeResponse {}

// ---------- File operations ----------

message ListFilesRequest {
  string volume_name = 1;
  string prefix = 2;
}
message ListFilesResponse {
  repeated FileInfo files = 1;
}

message GetFileRequest {
  string volume_name = 1;
  string path = 2;
}
message GetFileResponse {
  bytes data = 1;
}

message PutFileRequest {
  string volume_name = 1;
  string path = 2;
  bytes data = 3;
}
message PutFileResponse {}

message RemoveFileRequest {
  string volume_name = 1;
  string path = 2;
}
message RemoveFileResponse {}

// VolumeService manages persistent named volumes backed by object storage.
service VolumeService {
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse) {
    option (chalk.auth.v1.permission) = PERMISSION_TEAM_ADMIN;
  }

  rpc GetVolume(GetVolumeRequest) returns (GetVolumeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (chalk.auth.v1.permission) = PERMISSION_TEAM_ADMIN;
  }

  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (chalk.auth.v1.permission) = PERMISSION_TEAM_ADMIN;
  }

  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse) {
    option (chalk.auth.v1.permission) = PERMISSION_TEAM_ADMIN;
  }

  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (chalk.auth.v1.permission) = PERMISSION_TEAM_ADMIN;
  }

  rpc GetFile(GetFileRequest) returns (GetFileResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (chalk.auth.v1.permission) = PERMISSION_TEAM_ADMIN;
  }

  rpc PutFile(PutFileRequest) returns (PutFileResponse) {
    option (chalk.auth.v1.permission) = PERMISSION_TEAM_ADMIN;
  }

  rpc RemoveFile(RemoveFileRequest) returns (RemoveFileResponse) {
    option (chalk.auth.v1.permission) = PERMISSION_TEAM_ADMIN;
  }
}
